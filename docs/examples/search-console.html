<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive search console built with tty.css and Alpine.js."><title>Search console</title><link rel="stylesheet" href="../../tty.css"><script src="../assets/palette-settings.js"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.16.3/dist/cdn.min.js"></script><script>document.addEventListener('alpine:init',()=>Alpine.data('consoleApp',()=>({query:'distributed vector database',mode:'hybrid',namespace:'docs-production',topK:5,status:'idle',elapsed:0,history:[],results:[],fixtures:[{title:'Object storage architecture',score:.94,type:'Guide'},{title:'Vector indexing at scale',score:.91,type:'Documentation'},{title:'Hybrid retrieval patterns',score:.87,type:'Guide'},{title:'Cold cache behavior',score:.82,type:'Reference'},{title:'Namespace replication',score:.79,type:'Documentation'}],run(){if(!this.query.trim())return;this.status='running';this.results=[];setTimeout(()=>{this.elapsed=12+Math.floor(Math.random()*18);this.results=this.fixtures.slice(0,this.topK);this.history.unshift({query:this.query,mode:this.mode,time:this.elapsed});this.status='done'},500)},load(item){this.query=item.query;this.mode=item.mode;this.run()}})))</script></head><body x-data="consoleApp"><a class="sr-only" href="#content">Skip to console</a><header><nav><ul><li><strong>⌕ search console</strong></li><li><small x-text="namespace"></small></li></ul><ul><li><a href="#query" aria-current="page">Query</a></li><li><a href="#history">History</a></li><li><a href="./">Exit</a></li></ul></nav></header><main id="content"><section><h1>Query workspace</h1><p>Combine vector similarity, text ranking, and metadata filters.</p></section><section id="query"><form @submit.prevent="run"><fieldset><legend>Search request</legend><div class="grid"><div><label for="namespace">Namespace</label><select id="namespace" x-model="namespace"><option>docs-production</option><option>support-articles</option><option>product-catalog</option></select></div><div><label for="mode">Ranking mode</label><select id="mode" x-model="mode"><option value="hybrid">Hybrid</option><option value="vector">Vector</option><option value="text">Full text</option></select></div></div><label for="query-text">Query</label><textarea id="query-text" x-model="query" required placeholder="Describe what you are looking for"></textarea><div class="grid"><div><label for="top-k">Results: <span x-text="topK"></span></label><input id="top-k" type="range" min="1" max="5" x-model.number="topK"></div><div><label>Options</label><label><input type="checkbox" role="switch" checked> Explain ranking</label><label><input type="checkbox" checked> Include attributes</label></div></div><button type="submit" :disabled="status==='running'"><span x-text="status==='running' ? 'Searching…' : 'Run query →'"></span></button></fieldset></form></section>
<section aria-live="polite"><template x-if="status==='idle'"><article><header class="legend"><h2>Ready</h2></header><p>Configure a query and run it. No external API is called in this example.</p></article></template><template x-if="status==='running'"><article><header class="legend"><h2>Executing query</h2></header><progress></progress><p>Searching <code x-text="namespace"></code> with <span x-text="mode"></span> ranking…</p></article></template><template x-if="status==='done'"><article><header class="legend"><h2>Results</h2></header><p><strong x-text="results.length"></strong> results in <strong x-text="elapsed + 'ms'"></strong></p><div class="overflow-auto"><table><thead><tr><th scope="col">Document</th><th scope="col">Type</th><th scope="col">Score</th></tr></thead><tbody><template x-for="result in results" :key="result.title"><tr><th scope="row"><a href="#" x-text="result.title"></a></th><td x-text="result.type"></td><td><code x-text="result.score.toFixed(2)"></code></td></tr></template></tbody></table></div></article></template></section>
<section id="history"><h2>Query history</h2><template x-if="history.length===0"><p><small>No queries in this session.</small></p></template><div class="grid"><template x-for="item in history" :key="item.query + item.time"><article><h3 x-text="item.query"></h3><p><mark x-text="item.mode"></mark> <span x-text="item.time + 'ms'"></span></p><button class="outline" type="button" @click="load(item)">Run again</button></article></template></div></section></main><footer><nav><ul><li><small>Local simulation · Alpine.js 3.16.3</small></li></ul><ul><li><a href="./">Examples</a></li><li><a href="../reference/">Docs</a></li></ul></nav></footer></body></html>
